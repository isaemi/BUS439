# Streamlit theme matched to the UBC brand (see shw_analytics/theme.py).
[theme]
base = "light"
primaryColor = "#0055B7"
backgroundColor = "#F4F6F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14233B"
font = "sans serif"

# Only this laptop can open the app; other people on the same Wi-Fi cannot.
[server]
address = "localhost"

# Do not send usage statistics to Streamlit.
[browser]
gatherUsageStats = false
