# Insight playbook: the deeper questions SHW decision-makers can ask, and how to answer them
# well. The model looks entries up with the insight_playbook tool; staff never see this file.
#
# status:  ready      - can be answered fully with current tools and data
#          partial    - a useful answer is possible now; a planned tool or data would improve it
#          needs_data - cannot be answered properly until SHW provides the listed data
#
# Each entry: why it matters, the steps (tools and suggested settings), how to read the
# results, what to avoid, and how to word the answer for staff.

version: 1
use_cases:

- id: digest
  title: What should we know this term?
  status: ready
  audience: SHW leadership, service managers
  questions:
    - What should we know this term?
    - Is there anything surprising in the data?
    - Where should we focus?
    - Give me the headline findings.
    - What should leadership know before the meeting?
  keywords: [headline, surprising, focus, priorities, overview, insights, summary, notable, leadership, briefing, should know, three things]
  why: >
    Leaders asked for findings they cannot get from the dashboard. The term briefing runs every
    tested analysis, corrects for having run them all, and keeps only what holds up.
  steps:
    - {tool: term_briefing, purpose: "the ranked findings, what stayed the same, and what could not be checked"}
  read: >
    Report the findings in the order given, each with its figures, dates and group sizes. Then
    say what stayed the same and, briefly, what could not be checked. Do not add findings of
    your own or re-run the analyses.
  avoid:
    - Adding descriptive numbers as extra findings.
    - Dropping the "what stayed the same" part; it matters to leaders.
    - Explaining why something happened.
  say: >
    Number the findings. One sentence for the finding, one for the figures, one for what is
    worth checking next. Close with what stayed the same.
  next:
    - Which of those findings is the most reliable?
    - What data would make this briefing better?

- id: real_change_or_mix
  title: Is a change real, or just different students coming?
  status: ready
  audience: service managers
  questions:
    - Have no-shows changed since last year?
    - Is the change because different students are coming?
    - Did visits per student go down this fall?
    - Is time in care shorter than last year?
  keywords: [changed, change, since, last year, compared, mix, real, different students, fall, increase, decrease]
  why: >
    An overall number can move because the mix of students changed (e.g. more graduate
    students, who use services differently) or because something changed within groups. These
    call for different responses.
  steps:
    - {tool: what_changed, args: {metric: no_show_rate, dimension: academic_level, compare: last_year}, purpose: split the change and test it}
  read: >
    Use the verdict. "offsetting" means the overall number hides a real change within groups:
    report that prominently. Quote counts from volume_in_same_windows and the tested change in
    students seen from volume_change.
  avoid:
    - Whole-term totals when the current term is still in progress.
    - Calling either part a driver or cause.
    - Using compare=previous without mentioning seasonality.
  say: >
    "Over the same dates (X vs Y), the rate went from A to B. Most of that is [a change in who
    came / a change within groups]; [neither part is distinguishable from noise]."
  next:
    - Which groups changed most?
    - Is it the same for counselling alone?

- id: demand_growth
  title: Where is the growth in demand coming from?
  status: ready
  audience: SHW leadership, planning
  questions:
    - Why are we busier?
    - Which groups account for the increase in appointments?
    - Is growth from more students or more visits each?
  keywords: [busier, are we busier, growth, demand, increase, volume, more appointments, more students, capacity, where is the growth]
  why: >
    UBC reports large growth in counselling appointments in recent years. Knowing whether
    growth comes from more students or more visits per student, and from which groups, informs
    staffing and outreach.
  steps:
    - {tool: what_changed, args: {metric: visits_per_student, dimension: faculty}, purpose: tested change in students seen and in visits per student; per-group counts}
    - {tool: explain_difference, args: {dimension: academic_level, group: Graduate}, purpose: how intensity differs by level}
  read: >
    If students seen rose (tested) and visits per student did not change, the extra
    appointments are accounted for by more students. Per-group counts are descriptive.
  avoid:
    - Saying which group "drives" growth.
    - Treating per-group count changes as tested.
  say: >
    "Students seen rose X% (range A% to B%); visits per student did not clearly change, so the
    extra appointments are accounted for by more students."
  next:
    - Are the extra students coming back for second visits at the usual rate?
    - When are our busiest weeks?

- id: after_first_visit
  title: What happens after a student's first visit?
  status: ready
  audience: clinical leads, counselling management
  questions:
    - Do students come back after their first counselling visit?
    - How many students only have one visit?
    - How long until a second appointment?
    - Are some groups less likely to return?
  keywords: [first visit, come back, return, second appointment, single visit, one visit, continuity, follow-up, dropout, episode]
  why: >
    Continuity after first contact is hard to see in routine reports. With single-session and
    stepped care, a single visit is often the plan, so the useful question is which groups
    differ and whether the pattern matches what the service intends.
  steps:
    - {tool: care_journeys, args: {service_line: Counselling}, purpose: overall single visits, quick returns, time to a second visit}
    - {tool: care_journeys, args: {service_line: Counselling, dimension: academic_level}, purpose: tested differences by group}
  read: >
    Report the follow-up window used. Flags are group differences of 5+ points that survived
    the multiple-testing correction.
  avoid:
    - Calling single visits "dropout".
    - Comparing groups without their student counts.
  say: >
    "Of N students starting counselling between X and Y, A% had a single visit in the next 60
    days. Graduate students were B points [more/less] likely to have a single visit. Whether
    that reflects planned single-session care is a question for the clinical team."
  next:
    - Do students who miss an appointment come back?
    - What are students saying about follow-up?

- id: missed_then_lost
  title: Do students come back after missing an appointment?
  status: ready
  audience: clinical leads, front desk
  questions:
    - What happens after a student misses an appointment?
    - Do no-shows come back?
    - Should we follow up with students who miss?
  keywords: [missed, no-show, come back, follow up, lost, re-engage, after missing]
  why: >
    A missed appointment can be the point where a student drops out of care. The share who
    return within a set time shows whether outreach after a miss is worth testing.
  steps:
    - {tool: care_journeys, args: {service_line: Counselling}, purpose: missed_then_came_back figures}
  read: Report the share who attended again within the follow-up window and the number of students it is based on.
  avoid:
    - Assuming students who did not return stopped needing care.
  say: >
    "Of N students who missed a counselling appointment, A% attended another within 60 days."
  next:
    - Which appointments are missed most often?

- id: noshow_hotspots
  title: Which appointments are missed most often?
  status: partial
  audience: operations, front desk, service managers
  questions:
    - Which appointments get missed most?
    - Should we send extra reminders for virtual appointments?
    - Are no-shows higher on some days?
    - Who misses appointments more often?
  keywords: [no-show, missed, reminders, weekday, virtual, phone, video, in person, format, time of day, booking history]
  why: >
    Missed appointments are lost clinical time. Published studies find that past no-shows and
    long booking lead times are among the strongest predictors, so targeted reminders can help.
  steps:
    - {tool: noshow_patterns, args: {service_line: Counselling}, purpose: tested patterns by format, weekday, booking history and student group}
  read: >
    Flags are tested with each student counted once, corrected for many tests, with gaps of 3+
    points. Report the overall rate first, then the top 2 to 3 flags with their ranges.
  avoid:
    - Saying a format causes no-shows (it may reflect who books it).
    - Ignoring that booking lead time cannot be checked yet.
  say: >
    "Phone/video appointments were missed X points more often than others (range A to B). This
    is a pattern worth testing reminders against, not proof of cause."
  data_gaps: [Booking date for each appointment, to measure lead time]
  next:
    - Do students who miss an appointment come back?
    - Has the no-show rate changed since last year?

- id: integrated_care_pathways
  title: Are students moving between services as intended?
  status: ready
  audience: SHW leadership, integrated care leads
  questions:
    - Do students who see a doctor go on to counselling?
    - Is the integrated care model working?
    - How many medical clinic patients also use counselling?
  keywords: [pathway, pathways, referral, integrated, team-based, medical to counselling, between services, Gateway, cross-service]
  why: >
    UBC moved to integrated, team-based care in the Gateway Health building so a student can
    move from a medical visit to counselling easily. Movement between services shows whether
    that is happening.
  steps:
    - {tool: service_pathways, args: {within_days: 30}, purpose: share of students starting in one service who use another soon after}
    - {tool: what_changed, args: {metric: no_show_rate, dimension: service_line}, purpose: whether the service mix changed between years}
  read: Report the main pathway percentages with their ranges and the number of students starting in each service.
  avoid:
    - Calling movement a "referral": the records do not say why a student used another service.
  say: >
    "Of N students starting with the medical clinic, A% (range B% to C%) had a counselling
    visit within 30 days."
  next:
    - What happens after a student's first counselling visit?

- id: intensity_by_group
  title: Do some groups use services more intensively?
  status: ready
  audience: clinical leads, equity
  questions:
    - Do graduate students use counselling differently from undergraduates?
    - Do some faculties have longer episodes of care?
  keywords: [intensity, visits per student, days in care, differently, compare groups, graduate, undergraduate]
  why: Groups may need different care models; differences in visits and time in care inform that.
  steps:
    - {tool: explain_difference, args: {dimension: academic_level, group: Graduate, compare_to: Undergraduate, service_line: Counselling}, purpose: split the gap and test each part}
  read: Lead with the tested parts; mention the untested ones only as context.
  avoid:
    - Using a term that is still in progress.
  say: '"Graduate students made X visits each on average vs Y for undergraduates (tested)."'

- id: peak_load
  title: When are our busiest periods, and are they getting busier?
  status: ready
  audience: operations, scheduling
  questions:
    - When are we busiest?
    - Is this October busier than last October?
    - Which weeks should we staff up?
  keywords: [busiest, peak, weeks, month, staffing, schedule, seasonal, exam]
  why: Demand peaks around mid-term and exam periods; comparing each period with the same period last year separates growth from normal seasonality.
  steps:
    - {tool: chr_trend, args: {freq: week}, purpose: weekly pattern and same week last year}
    - {tool: what_changed, args: {metric: no_show_rate, dimension: service_line, window_days: 30}, purpose: tested change for the latest month}
  read: Compare each period with the same period a year earlier, not with the previous period.
  avoid:
    - Comparing a partly covered month or term with a complete one.
  say: '"Weeks X to Y were the busiest; this year they were A% busier than the same weeks last year."'

- id: format_mix
  title: How do in-person and virtual appointments compare?
  status: ready
  audience: service managers
  questions:
    - Are virtual appointments working as well as in-person ones?
    - Has the share of virtual appointments changed?
  keywords: [virtual, in person, phone, video, format, online, telehealth, mode]
  why: Format affects access and attendance; knowing who uses which format informs scheduling.
  steps:
    - {tool: chr_summary, args: {dimension: mode}, purpose: volume and no-shows by format}
    - {tool: noshow_patterns, purpose: tested no-show gap by format}
    - {tool: what_changed, args: {metric: no_show_rate, dimension: mode}, purpose: whether the format mix shifted since last year}
  read: Use noshow_patterns for the tested gap; chr_summary figures are descriptive.
  avoid:
    - Concluding a format is worse; it may serve different students.
  say: '"Phone/video was X% of appointments this fall vs Y% last fall; it was missed A points more often (tested)."'

- id: reaching_groups
  title: Are we reaching the students who need us?
  status: needs_data
  audience: SHW leadership, equity, outreach
  questions:
    - Are international graduate students under-using counselling?
    - Which groups are under-served?
    - Are we reaching first-generation students?
  keywords: [reach, reaching, under-served, under-use, access, equity, international, first-generation, outreach, population]
  why: >
    Research on Canadian students finds international graduate students are less likely to
    use campus mental health services. Telling under-use from low need requires each group's
    share of the student population as a denominator, which the app does not have yet.
  steps:
    - {tool: survey_vs_visits, purpose: whether respondents resemble the students who visit}
    - {tool: chr_summary, args: {dimension: academic_level}, purpose: who is seen, descriptively}
    - {tool: care_journeys, args: {dimension: academic_level}, purpose: whether continuity differs by group}
  read: >
    Without enrolment counts, say "X% of students seen were graduate students" but never
    "graduate students are under-served".
  avoid:
    - Calling a group under-served without population denominators.
  say: >
    "We can describe who is seen, but not yet who is missing: that needs enrolment numbers by
    group from UBC."
  data_gaps: [Enrolment counts by faculty, level, international and first-generation status]
  next:
    - What data would let us say whether a group is under-served?

- id: survey_weak_spots
  title: Which parts of a service experience matter most, and need attention?
  status: ready
  audience: service managers
  questions:
    - What should counselling focus on to improve students' overall experience?
    - Which parts of a medical clinic visit matter most to how students rate it?
    - We scored lowest on booking. Is that what's hurting satisfaction most?
    - Of everything we ask about, what's most closely linked to students feeling satisfied?
    - Which survey questions score lowest?
  keywords: [focus, improve, matters most, most linked, key driver, drivers, priorities, weakest, lowest, satisfaction, overall experience, fix first, what should we focus]
  why: >
    The lowest-scoring question is not necessarily the one that matters most. Key-driver
    analysis links each question to the service's overall question (satisfaction, or
    recommending) and combines that with how well it scores.
  steps:
    - {tool: priority_items, args: {service: counselling}, purpose: priorities that hold up when students are re-sampled}
    - {tool: search_comments, args: {query: "the top priority's topic", service: counselling}, purpose: students' own words on the priority}
  read: >
    Lead with the verdict. clear_priorities: name each priority with its link, % agree and n.
    no_single_item_stands_out or no_stable_priority: say so plainly and do not rank questions
    as if one mattered more. Mention keep_up items as strengths. Flag access questions as
    understated.
  avoid:
    - Saying a question "drives" satisfaction; say "most closely linked to".
    - Telling staff what to do ("fix first", "keep it up"); describe priorities and strengths and leave the decision to them.
    - Treating the lowest-scoring question as the priority without the link.
    - Running it for a service with too few respondents (the tool will decline; pass that on).
  say: >
    "Of the questions about counselling, 'X' is most closely linked to overall satisfaction
    (link 0.62), and A% agree (n=N), which makes it the clearest priority. 'Y' scores
    well and is also closely linked: a strength to keep."
  next:
    - What matters most to students in the medical clinic?
    - Do some groups of students rate counselling lower?

- id: survey_equity_gaps
  title: Do some student groups rate services lower?
  status: ready
  audience: equity, service managers
  questions:
    - Do disabled students rate services lower?
    - Are there gaps between student groups in the survey?
  keywords: [gaps, groups, equity, disability, gender, international, first-generation, lower ratings]
  why: Equity gaps in experience point to where services may not fit some students.
  steps:
    - {tool: equity_flags, purpose: tested scan of all groups}
    - {tool: group_vs_everyone, args: {dimension: disability_any, value: "yes"}, purpose: one group in detail}
  read: Report only flagged gaps, with group sizes; say how many comparisons were checked.
  avoid:
    - Reporting untested differences from compare_groups as gaps.
  say: '"Of N comparisons checked, two gaps stood out: ..."'
  next:
    - What matters most to students in counselling?

- id: hidden_subgroups
  title: Are there groups having a very different experience that we would not notice?
  status: partial
  audience: equity, leadership
  questions:
    - Are there combinations of groups doing much worse?
    - Is anything hidden that the dashboard would miss?
  keywords: [hidden, combinations, subgroups, intersection, combined, both, dashboard would miss, in particular faculties, particular, among]
  why: Dashboards filter one dimension at a time; some gaps only appear in combinations (e.g. international AND graduate).
  steps:
    - {tool: equity_flags, purpose: one-dimension scan for now}
    - {tool: noshow_patterns, purpose: appointment-side patterns by group}
  read: >
    A systematic scan of combinations is planned and not yet available. Say so first, then
    report the one-at-a-time results. Never answer "no group is worse" to a question about
    combinations, because combinations were not checked.
  avoid:
    - Hand-picking combinations with custom queries and calling them findings (too many chance results).
    - Answering a combination question (e.g. first-generation students in particular faculties) with "no".
  say: '"Combinations of groups cannot be checked systematically yet. One group at a time, ..."'

- id: voice_behind_numbers
  title: What are students saying behind a number?
  status: ready
  audience: all
  questions:
    - What are students saying about booking?
    - Why might graduate students rate counselling lower?
  keywords: [comments, saying, voice, words, themes, why, booking, feedback]
  why: Comments make a finding concrete and suggest what to look into, without proving cause.
  steps:
    - {tool: comment_overview, args: {service: counselling}, purpose: themes and tone}
    - {tool: search_comments, args: {query: booking, service: counselling}, purpose: examples on the topic}
  read: Quote short, de-identified comments; give the number of comments behind each theme.
  avoid:
    - Treating a few comments as representative.
  say: '"Of N counselling comments, A mentioned booking; for example: ..."'

- id: survey_representativeness
  title: Can we trust the survey to speak for students who visit?
  status: ready
  audience: research, leadership
  questions:
    - Does the survey represent our users?
    - Which groups are missing from the survey?
  keywords: [representative, respondents, response, bias, survey sample, who answered]
  why: If some faculties are under-represented among respondents, survey averages lean towards others.
  steps:
    - {tool: survey_vs_visits, args: {dimension: faculty}, purpose: compare respondent mix with visitor mix}
  read: Name the groups most over- and under-represented, with both percentages.
  avoid:
    - Correcting averages by hand.
  say: '"Arts students were X% of visitors but Y% of respondents."'

- id: wait_and_experience
  title: Does waiting longer affect how students rate their care?
  status: ready
  audience: service managers
  questions:
    - Do longer waits lead to lower ratings?
    - How long is too long to wait?
  keywords: [wait, waiting, wait time, delay, how long]
  why: Wait time is a common complaint; linking it to ratings shows whether it matters for experience.
  steps:
    - {tool: wait_time_vs_rating, args: {service: counselling}, purpose: relationship between wait and ratings}
  read: Describe the pattern; a relationship is not proof that waiting causes lower ratings.
  avoid:
    - Inferring a wait-time target from very few responses.
  say: '"Students who waited more than X days rated counselling lower on average (n=N)."'

- id: capacity_caseload
  title: Is our caseload high compared with similar services?
  status: needs_data
  audience: SHW leadership
  questions:
    - Is our counselling caseload high?
    - How do we compare with other universities?
  keywords: [caseload, capacity, staffing, compare universities, benchmark, clinical load, counsellors]
  why: >
    The Clinical Load Index from the Center for Collegiate Mental Health relates students seen
    per year to clinical staff hours and is widely used to benchmark counselling caseloads.
  steps:
    - {tool: chr_summary, args: {service_line: Counselling}, purpose: students seen (the numerator)}
  read: Without clinical staff hours, report students seen only and explain what is missing.
  avoid:
    - Estimating staffing from appointment counts.
  say: '"We can count students seen; a caseload comparison needs weekly clinical hours."'
  data_gaps: [Weekly clinical hours by service, as used for the Clinical Load Index]

- id: categorical_association
  title: Are two categories or survey responses related?
  status: ready
  audience: service managers, survey analysts
  questions:
  - Are students who struggle to book counselling appointments less satisfied?
  - Does faculty relate to counselling satisfaction?
  - Are no-shows more common in some appointment types?
  - Is satisfaction associated with ease of booking?
  keywords:
  - association
  - associated
  - related
  - relationship
  - linked
  - connected
  - booking satisfaction
  - difficulty booking
  - less satisfied
  - more satisfied
  - chi squared
  - chi-square
  - significant difference
  - no-show rates by
  - faculty satisfaction
  why: For questions about relationships between categorical responses, descriptive percentages alone cannot establish
    statistical evidence.
  steps:
  - tool: lookup_survey_items
    purpose: REQUIRED first step for survey associations; retrieve current service item_code and item_text, and verify both requested concepts before analysis
  - tool: test_association
    purpose: Use two verified item_code strings from lookup_survey_items, never question wording or paraphrases
  - tool: demographic_association
    purpose: Use for a demographic category versus a verified survey rating; handle multi-select demographics as
      separate selected-versus-not-selected tests with BH correction
  - tool: chr_categorical_association
    purpose: Use for two permitted CHR categorical attributes only when the student-level independence checks and
      variables fit the question
  read: Check variable definitions, service, respondent counts, privacy suppression, expected frequencies and independence.
    Report group percentages, chi-square, df, p-value and Cramers V when provided. For multi-select comparisons
    report total tested, excluded and BH-adjusted q-values. A p-value rounded to zero should be described as p <
    0.001.
  avoid:
  - Do not use Chi-squared for a simple count or time trend.
  - Do not infer the direction of a relationship from chi-square alone; inspect group proportions.
  - Do not use an appointment-level Chi-squared test when patients have repeated appointments; use a valid student-level
    analysis or state the limitation.
  - Do not invent survey item codes, test statistics, or a causal conclusion.
  say: Describe the observed group pattern and whether the statistical evidence supports an association, with sample
    size and limitations; never claim causation.
  variable_selection: >
    Before selecting an association tool, translate each concept in the staff question
    into a verified survey question's exact wording and service. Prefer the item whose
    meaning directly matches the question, not a convenient related column. For
    Counselling, "difficulty booking", "struggled to book", "ease of booking", and
    "able to book" point to the question "I was able to book an appointment easily"
    (historically CS1_1). "Overall satisfaction", "satisfied with the support", and
    "happy with counselling support" point to "Overall, I am satisfied with the
    support I received" (historically CS1_11). Always verify these codes against
    the current item wording and service before analysis. cs_fell_short measures a
    different concept (whether an experience fell short of expectations); it must
    not stand in for ease or difficulty of booking. For Wellness Advising, phrases
    such as "difficulty booking", "trouble scheduling", "hard to book", and
    "problems making an appointment" refer to "I was able to book an appointment
    easily" (historically WA1_1). Overall support satisfaction is asked twice
    with identical wording (historically WA1_8 and WA1_10): verify both in the
    current database and check usable paired responses and privacy restrictions
    before selecting an item; disclose the chosen measure. Do not assume a
    privacy-suppressed count means zero observations. For Medical or other services,
    look up their own item wording rather than borrowing Counselling codes. If
    the exact measure is unavailable, explain that; if two genuinely plausible
    items remain, ask one concise clarification question before testing.
  examples:
    - question: Are students who struggle to book counselling appointments less satisfied?
      resolve: Verify Counselling booking-ease item and overall-support satisfaction item; compare their paired responses. Do not use cs_fell_short.
    - question: Do students whose counselling experience fell short report lower satisfaction?
      resolve: This explicitly concerns falling short of expectations, not booking ease; verify the expectations measure and satisfaction measure.
    - question: Are students who have difficulty booking Wellness Advising appointments less satisfied with support?
      resolve: Verify Wellness Advising booking ease and both identically worded overall satisfaction items. Use a satisfaction item with valid paired responses and disclose which was tested. Do not substitute wait time or centre access.
    - question: Do students who struggle to schedule Wellness appointments report lower satisfaction?
      resolve: Treat Wellness as Wellness Advising only when the intended service is clear; verify the booking-ease and overall-support satisfaction questions and test paired responses if available.
    - question: Does difficulty booking affect satisfaction in Medical?
      resolve: Search Medical item wording for booking ease and satisfaction; do not reuse Counselling item codes or infer causation.
